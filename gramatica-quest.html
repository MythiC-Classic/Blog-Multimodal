<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gramática Quest — Aprende español jugando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#171321;
  --card:#21182f;
  --ink:#f1edf7;
  --muted:#aaa0b9;
  --line:#514466;
  --brand:#8065ff;
  --brand-dark:#5b42d9;
  --brand-ink:#ffffff;
  --brand-soft:#34275a;
  --good:#55c995;
  --good-bg:#123329;
  --good-line:#347a5b;
  --bad:#f0787d;
  --bad-bg:#351b21;
  --bad-line:#7e3e45;
  --gold:#a997ff;
  --shadow:0 6px 0 rgba(0,0,0,.35);
}

:root[data-theme="light"],
:root[data-theme="dark"]{
  --bg:#171321;
  --card:#21182f;
  --ink:#f1edf7;
  --muted:#aaa0b9;
  --line:#514466;
  --brand:#8065ff;
  --brand-dark:#5b42d9;
  --brand-ink:#ffffff;
  --brand-soft:#34275a;
  --good:#55c995;
  --good-bg:#123329;
  --good-line:#347a5b;
  --bad:#f0787d;
  --bad-bg:#351b21;
  --bad-line:#7e3e45;
  --gold:#a997ff;
  --shadow:0 6px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:
    radial-gradient(circle at 20% 0%, rgba(128,101,255,.14), transparent 32%),
    radial-gradient(circle at 90% 85%, rgba(82,68,118,.12), transparent 30%),
    var(--bg);
  color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%;
}
h1,h2,h3,.brand,.btn,.pill{font-family:'Baloo 2','Nunito',system-ui,sans-serif}
.app{max-width:720px; margin:0 auto; padding:14px 16px 40px}
.top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; min-height:48px}
.brand{
  display:flex; align-items:center; gap:8px; background:none; border:0; cursor:pointer;
  font-size:1.35rem; font-weight:800; color:var(--brand); padding:4px 0;
}
.logo{display:grid; place-items:center; width:38px; height:38px; border-radius:12px; background:var(--brand); color:#fff; font-size:1.2rem; box-shadow:0 3px 0 var(--brand-dark)}
.hud{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.pill{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:1px 11px; font-weight:700; font-size:.98rem; white-space:nowrap}
.progress{height:12px; background:var(--line); border-radius:99px; overflow:hidden; margin:2px 0 16px}
.progress>div{height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--brand)); border-radius:99px; transition:width .4s ease}
.card{background:linear-gradient(145deg,rgba(40,27,60,.96),rgba(21,16,33,.98)); border:2px solid var(--line); border-radius:22px; padding:20px; box-shadow:var(--shadow)}
.hero{text-align:center; padding:8px 4px 4px}
.hero .big{font-size:3.2rem; line-height:1}
h1{margin:6px 0 4px; font-size:2.1rem; line-height:1.1; font-weight:800}
.sub{color:var(--muted); margin:0 auto 6px; max-width:32em}
h2{font-size:1.15rem; margin:22px 0 8px; font-weight:800}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  font:inherit; font-weight:700; cursor:pointer; color:var(--ink);
  background:var(--card); border:2px solid var(--line); border-radius:999px; padding:7px 14px;
}
.chip[aria-pressed="true"]{background:var(--brand-soft); border-color:var(--brand); color:#9b87ff}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px}
.mode{
  font:inherit; text-align:left; cursor:pointer; color:var(--ink);
  background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px 14px;
  display:flex; flex-direction:column; gap:2px;
}
.mode b{font-family:'Baloo 2',sans-serif; font-size:1.05rem}
.mode small{color:var(--muted); line-height:1.3}
.mode[aria-pressed="true"]{border-color:var(--brand); background:var(--brand-soft); box-shadow:0 0 0 1px rgba(128,101,255,.12) inset}
.mode:disabled{opacity:.6; cursor:progress}
.btn{
  font-size:1.1rem; font-weight:800; cursor:pointer; border:0; border-radius:16px; padding:12px 22px;
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn.primary{background:var(--brand); color:var(--brand-ink); box-shadow:0 5px 0 var(--brand-dark)}
.btn.primary:active{transform:translateY(4px); box-shadow:0 1px 0 var(--brand-dark)}
.btn.ghost{background:var(--card); color:#9b87ff; border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand); background:var(--brand-soft)}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.btn.wide{width:100%; margin-top:22px; font-size:1.3rem; padding:14px}
.best{text-align:center; color:var(--muted); margin-top:14px; font-weight:700}
.notice{background:var(--brand-soft); border:2px solid var(--brand); color:var(--ink); border-radius:14px; padding:10px 14px; margin:0 0 14px; font-size:.95rem}
.badge{
  display:inline-block; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.9rem;
  background:var(--brand-soft); color:var(--brand); border-radius:999px; padding:1px 12px; margin-bottom:8px;
}
.qtext{font-family:'Baloo 2',sans-serif; font-size:1.4rem; line-height:1.3; font-weight:700; margin:0 0 16px; white-space:pre-line}
.choices{display:grid; gap:10px}
.choice{
  font:inherit; font-weight:700; text-align:left; cursor:pointer; color:var(--ink);
  background:var(--card); border:2px solid var(--line); border-radius:14px; padding:13px 16px;
  box-shadow:0 3px 0 var(--line);
}
.choice:hover:not(:disabled){border-color:var(--brand); background:#2a203d}
.choice.right,.word.right,.slots.right{background:var(--good-bg); border-color:var(--good); color:var(--ink)}
.choice.wrong,.word.wrong,.slots.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--ink)}
.choice.dim{opacity:.55}
.hintbox{margin-top:12px}
.hint{background:var(--brand-soft); border-radius:12px; padding:10px 14px; margin-top:8px; font-weight:600}
.slots{
  min-height:64px; border:2px dashed var(--line); border-radius:16px; padding:10px;
  display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;
}
.slots .ph{color:var(--muted); font-size:.95rem}
.pool{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.tile,.word{
  font:inherit; font-weight:800; cursor:pointer; color:var(--ink);
  background:var(--card); border:2px solid var(--line); border-radius:12px; padding:8px 14px;
  box-shadow:0 3px 0 var(--line);
}
.tile:hover:not(:disabled),.word:hover:not(:disabled){border-color:var(--brand); background:#2a203d}
.words{display:flex; flex-wrap:wrap; gap:8px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.fb{margin-top:18px; border-radius:18px; padding:14px 16px; border:2px solid}
.fb.ok{background:var(--good-bg); border-color:var(--good-line)}
.fb.no{background:var(--bad-bg); border-color:var(--bad-line)}
.fb-title{font-family:'Baloo 2',sans-serif; font-size:1.3rem; font-weight:800}
.fb.ok .fb-title{color:var(--good)} .fb.no .fb-title{color:var(--bad)}
.fb-detail{font-weight:800; margin:2px 0 4px}
.fb-expl{margin:4px 0 12px}
.fb-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end}
.center{text-align:center}
.stars{font-size:2.6rem; letter-spacing:6px; margin:4px 0}
.stats{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:14px 0}
.stat{background:var(--brand-soft); border-radius:16px; padding:8px 18px; min-width:110px}
.stat b{display:block; font-family:'Baloo 2',sans-serif; font-size:1.7rem; line-height:1.1}
.stat span{color:var(--muted); font-size:.9rem}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none} .progress>div{transition:none}}
button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand" type="button" aria-label="Ir al inicio"><span class="logo">✏️</span><span>Gramática Quest</span></button>
    <div class="hud" id="hud" hidden>
      <span class="pill" id="hLives"></span>
      <span class="pill" id="hStreak"></span>
      <span class="pill" id="hScore"></span>
    </div>
  </header>
  <div class="progress" id="progress" hidden><div id="bar"></div></div>
  <div class="notice" id="notice" hidden></div>

  <main>
    <!-- INICIO -->
    <section id="home">
      <div class="card">
        <div class="hero">
          <div class="big">📚</div>
          <h1>¡Aprende gramática jugando!</h1>
          <p class="sub">Preguntas, puzles y acertijos de español. Tienes 3 vidas y 10 retos. ¿Podrás lograr las 3 estrellas?</p>
        </div>
        <h2>1. Elige tu nivel</h2>
        <div class="chips" id="levels"></div>
        <h2>2. Elige un tema</h2>
        <div class="chips" id="topics"></div>
        <h2>3. ¿Cómo quieres jugar?</h2>
        <div class="modes">
          <button type="button" class="mode" id="modeMotor" aria-pressed="true"><b>🧠 Motor propio</b><small>Retos infinitos creados por el juego, sin internet</small></button>
          <button type="button" class="mode" id="modeLocal" aria-pressed="false"><b>📚 Banco incluido</b><small>25 retos escritos a mano</small></button>
        </div>
        <button class="btn primary wide" id="start" type="button">¡Empezar aventura! 🚀</button>
        <div class="best" id="best"></div>
      </div>
    </section>

    <!-- JUEGO -->
    <section id="play" hidden>
      <div class="card pop" id="qcard">
        <span class="badge" id="qtype"></span>
        <p class="qtext" id="qtext"></p>
        <div id="area"></div>
        <div class="fb" id="fb" hidden role="status" aria-live="polite">
          <div class="fb-title" id="fbTitle"></div>
          <div class="fb-detail" id="fbDetail"></div>
          <p class="fb-expl" id="fbExpl"></p>
          <div class="fb-actions">
            <button class="btn primary" id="btnNext" type="button">Siguiente →</button>
          </div>
        </div>
      </div>
    </section>

    <!-- FINAL -->
    <section id="end" hidden>
      <div class="card center">
        <div class="stars" id="endStars"></div>
        <h1 id="endTitle"></h1>
        <p class="sub" id="endMsg"></p>
        <div class="stats">
          <div class="stat"><b id="endScore">0</b><span>puntos</span></div>
          <div class="stat"><b id="endOk">0</b><span>aciertos</span></div>
          <div class="stat"><b id="endBest">0</b><span>récord</span></div>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn primary" id="again" type="button">Jugar otra vez 🔁</button>
          <button class="btn ghost" id="toHome" type="button">Cambiar tema</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function shuffle(a){ const r = a.slice(); for(let i = r.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function loadBest(){ try{ return Number(localStorage.getItem('gq_best')) || 0; }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('gq_best', String(v)); }catch(e){} }
const isStr = v => typeof v === 'string' && v.trim().length > 0;

/* ---------- Datos ---------- */
const LEVELS = {
  'Primaria':     { label:'🌱 Primaria',     desc:'estudiantes de primaria (8 a 11 años): vocabulario sencillo y conceptos básicos' },
  'Secundaria':   { label:'🚀 Secundaria',   desc:'estudiantes de secundaria (12 a 15 años): conceptos de dificultad intermedia' },
  'Bachillerato': { label:'🎓 Bachillerato', desc:'estudiantes de bachillerato (16 a 18 años): conceptos avanzados (oraciones compuestas, subjuntivo, perífrasis, etc.)' }
};
const TOPICS = {
  todos:{ label:'🌈 Todos los temas',           desc:'gramática y ortografía general del español (mezcla variada de temas)' },
  sust: { label:'🏷️ Sustantivos y adjetivos',   desc:'sustantivos, adjetivos, artículos, género, número y concordancia' },
  verb: { label:'🏃 Verbos',                    desc:'verbos: conjugación, tiempos, modos, personas, infinitivos y concordancia sujeto-verbo' },
  tilde:{ label:'✨ Tildes y acentos',           desc:'acentuación: palabras agudas, graves, esdrújulas, tilde diacrítica, diptongos e hiatos' },
  orto: { label:'🔤 Ortografía',                desc:'ortografía: b/v, g/j, h, c/s/z, ll/y y palabras que se confunden (haber/a ver, hay/ahí/ay, etc.)' },
  punt: { label:'❗ Puntuación',                 desc:'signos de puntuación: coma, punto, dos puntos, signos de interrogación y exclamación, comillas y guiones' },
  ora:  { label:'🧩 La oración',                desc:'la oración: sujeto, predicado, complementos y tipos de oración' },
  pron: { label:'👉 Pronombres y preposiciones', desc:'pronombres personales, posesivos y demostrativos, preposiciones, conjunciones y adverbios' },
  sin:  { label:'🔄 Sinónimos y antónimos',     desc:'sinónimos, antónimos, palabras polisémicas y familias de palabras' }
};
const TYPE_LABEL = { opcion:'❓ Pregunta', acertijo:'🕵️ Acertijo', ordenar:'🧩 Puzle', error:'🔎 Caza-errores' };

/* Banco local de retos escritos a mano */
const BANK = [
 {tema:'sust',tipo:'opcion',pregunta:'¿Cuál de estas palabras es un sustantivo propio?',opciones:['ciudad','Panamá','bonito','correr'],correcta:1,explicacion:'Los sustantivos propios nombran personas, lugares o cosas únicas y se escriben con mayúscula inicial: Panamá.'},
 {tema:'sust',tipo:'opcion',pregunta:'En «El perro pequeño ladra», ¿qué palabra es un adjetivo?',opciones:['perro','pequeño','ladra','El'],correcta:1,explicacion:'El adjetivo acompaña al sustantivo y dice cómo es: «pequeño» describe al perro.'},
 {tema:'sust',tipo:'acertijo',pregunta:'Nombro a personas, animales y cosas,\ny tengo género y número.\n¿Qué palabra soy?',opciones:['Verbo','Sustantivo','Adverbio','Preposición'],correcta:1,pista:'Sirvo para nombrar todo lo que existe: mesa, Ana, perro…',explicacion:'El sustantivo nombra seres y objetos y varía en género y número.'},
 {tema:'sust',tipo:'ordenar',instruccion:'Ordena las palabras para formar una oración.',palabras:['Los','niños','pequeños','juegan','en','el','parque.'],explicacion:'El sustantivo «niños» concuerda en género y número con el artículo «Los» y el adjetivo «pequeños».'},
 {tema:'verb',tipo:'opcion',pregunta:'Completa: Ayer nosotros ___ al cine.',opciones:['vamos','fuimos','iremos','vayamos'],correcta:1,explicacion:'«Ayer» indica pasado, por eso usamos el pretérito: «fuimos».'},
 {tema:'verb',tipo:'opcion',pregunta:'¿Cuál es el infinitivo del verbo en «Ellos comieron pizza»?',opciones:['comer','comar','comir','comiendo'],correcta:0,explicacion:'«Comieron» viene del verbo «comer», cuyo infinitivo termina en -er.'},
 {tema:'verb',tipo:'error',palabras:['Yo','tiene','un','perro','muy','simpático.'],indiceError:1,correccion:'tengo',explicacion:'El sujeto «Yo» exige la primera persona del verbo: «tengo».'},
 {tema:'verb',tipo:'acertijo',pregunta:'Expreso acciones, estados y procesos,\ny me conjugo en tiempos y personas.\n¿Qué soy?',opciones:['Sustantivo','Adjetivo','Verbo','Artículo'],correcta:2,pista:'Correr, saltar y ser son ejemplos de mí.',explicacion:'El verbo es la palabra que se conjuga y expresa acción, estado o proceso.'},
 {tema:'tilde',tipo:'opcion',pregunta:'¿Cuál palabra está bien escrita?',opciones:['canción','cancion','cáncion','cancíon'],correcta:0,explicacion:'«Canción» es aguda y termina en -n, por eso lleva tilde en la última sílaba.'},
 {tema:'tilde',tipo:'opcion',pregunta:'¿Cuál de estas palabras es esdrújula?',opciones:['árbol','teléfono','canción','mesa'],correcta:1,explicacion:'Las esdrújulas llevan el acento en la antepenúltima sílaba y siempre llevan tilde: te-LÉ-fo-no.'},
 {tema:'tilde',tipo:'opcion',pregunta:'Completa la pregunta: ¿___ te llamas?',opciones:['Como','Cómo','Comó','Cómó'],correcta:1,explicacion:'Los interrogativos llevan tilde diacrítica: «¿Cómo?».'},
 {tema:'orto',tipo:'opcion',pregunta:'Completa: ¡___ qué me traes de sorpresa!',opciones:['A ver','Haber','Ha ver','Aver'],correcta:0,explicacion:'«A ver» (preposición + verbo) sirve para pedir que nos muestren algo. «Haber» es otro verbo: «debe haber».'},
 {tema:'orto',tipo:'opcion',pregunta:'¿Cuál palabra está bien escrita?',opciones:['hacer','acer','hazer','aser'],correcta:0,explicacion:'«Hacer» se escribe con h inicial y con c, porque viene del latín «facere».'},
 {tema:'punt',tipo:'opcion',pregunta:'¿Qué signo falta al inicio? «___Cómo te llamas?»',opciones:['¡','¿','«','('],correcta:1,explicacion:'En español las preguntas se abren con ¿ y se cierran con ?.'},
 {tema:'punt',tipo:'opcion',pregunta:'¿Cuál oración usa bien las comas en una enumeración?',opciones:['Compré pan, leche, huevos y queso.','Compré, pan leche huevos y queso.','Compré pan leche, huevos, y queso.','Compré pan, leche huevos, y queso.'],correcta:0,explicacion:'Se separan los elementos con comas, y antes de la «y» final no se pone coma.'},
 {tema:'ora',tipo:'opcion',pregunta:'En «Mi hermana canta en el coro», ¿cuál es el sujeto?',opciones:['canta','en el coro','Mi hermana','el coro'],correcta:2,explicacion:'El sujeto es quien realiza la acción: «Mi hermana».'},
 {tema:'ora',tipo:'ordenar',instruccion:'Ordena las palabras para formar una oración.',palabras:['Ana','lee','un','libro','interesante.'],explicacion:'Estructura básica: sujeto («Ana»), verbo («lee») y complemento («un libro interesante»).'},
 {tema:'ora',tipo:'error',palabras:['Las','niñas','juega','en','el','patio.'],indiceError:2,correccion:'juegan',explicacion:'El sujeto «Las niñas» es plural, así que el verbo también: «juegan».'},
 {tema:'pron',tipo:'opcion',pregunta:'¿Qué pronombre reemplaza a «Pedro» en «Pedro come manzanas»?',opciones:['Ella','Él','Ellos','Yo'],correcta:1,explicacion:'Pedro es una sola persona masculina, por eso usamos «Él».'},
 {tema:'pron',tipo:'opcion',pregunta:'Completa: El libro está ___ la mesa. (encima de ella)',opciones:['sobre','con','desde','hacia'],correcta:0,explicacion:'«Sobre» es una preposición que indica que algo está encima de otra cosa.'},
 {tema:'pron',tipo:'acertijo',pregunta:'Soy pequeña y voy antes de un sustantivo\npara indicar lugar, compañía o dirección:\na, de, en, con… ¿Qué soy?',opciones:['Preposición','Pronombre','Verbo','Adverbio'],correcta:0,pista:'Con mi ayuda dices «con mamá» o «en casa».',explicacion:'Las preposiciones son palabras invariables que enlazan elementos de la oración.'},
 {tema:'sin',tipo:'opcion',pregunta:'¿Cuál es un sinónimo de «feliz»?',opciones:['triste','contento','enojado','cansado'],correcta:1,explicacion:'Los sinónimos tienen significados parecidos: feliz y contento.'},
 {tema:'sin',tipo:'opcion',pregunta:'¿Cuál es el antónimo de «generoso»?',opciones:['Rico','Tacaño','Amable','Alto'],correcta:1,explicacion:'Los antónimos tienen significados opuestos: generoso ↔ tacaño.'},
 {tema:'sin',tipo:'acertijo',pregunta:'Digo lo mismo que otra palabra,\npero me escribo distinto.\n¿Qué soy?',opciones:['Antónimo','Sinónimo','Verbo','Diptongo'],correcta:1,pista:'Mi nombre viene del griego: significados que van «juntos».',explicacion:'Un sinónimo es una palabra con significado igual o muy parecido a otra.'}
];

/* ---------- Estado ---------- */
const S = {
  level:'Primaria', topic:'todos', mode:'motor',
  total:10, lives:3, score:0, streak:0, correct:0, idx:0,
  seen:[], usedBank:new Set(), current:null, answered:false, hintUsed:false
};
function updateModeUI(){
  $('#modeMotor').setAttribute('aria-pressed', String(S.mode === 'motor'));
  $('#modeLocal').setAttribute('aria-pressed', String(S.mode === 'local'));
}

/* ---------- Normalizar y validar ejercicios ---------- */
function normalize(q){
  if(!q || typeof q !== 'object') return null;
  const t = q.tipo;
  if(t === 'opcion' || t === 'acertijo'){
    if(!isStr(q.pregunta) || !Array.isArray(q.opciones) || q.opciones.length < 2 || q.opciones.length > 6 || !isStr(q.explicacion)) return null;
    const ops = q.opciones.map(o => String(o));
    if(new Set(ops.map(o => o.trim().toLowerCase())).size !== ops.length) return null;
    const c = Number(q.correcta);
    if(!Number.isInteger(c) || c < 0 || c >= ops.length) return null;
    const order = shuffle(ops.map((_, i) => i));
    const opciones = order.map(i => ops[i]);
    const correcta = order.indexOf(c);
    return { tipo:t, texto:q.pregunta, opciones, correcta, pista:isStr(q.pista) ? q.pista : '', explicacion:q.explicacion,
             resumen:q.pregunta.replace(/\n/g, ' ') + ' Respuesta correcta: ' + ops[c] };
  }
  if(t === 'ordenar'){
    if(!Array.isArray(q.palabras) || q.palabras.length < 3 || q.palabras.length > 12 || !q.palabras.every(isStr) || !isStr(q.explicacion)) return null;
    const palabras = q.palabras.map(w => String(w).trim());
    return { tipo:t, texto:isStr(q.instruccion) ? q.instruccion : 'Ordena las palabras para formar una oración correcta.', palabras,
             explicacion:q.explicacion, resumen:'Ordenar la oración: ' + palabras.join(' ') };
  }
  if(t === 'error'){
    const i = Number(q.indiceError);
    if(!Array.isArray(q.palabras) || q.palabras.length < 3 || q.palabras.length > 12 || !q.palabras.every(isStr) || !Number.isInteger(i) || i < 0 || i >= q.palabras.length || !isStr(q.correccion) || !isStr(q.explicacion)) return null;
    const palabras = q.palabras.map(w => String(w).trim());
    if(palabras[i].toLowerCase() === String(q.correccion).trim().toLowerCase()) return null;
    return { tipo:t, texto:'Hay una palabra con un error. ¡Tócala para corregirla!', palabras, indiceError:i, correccion:String(q.correccion).trim(),
             explicacion:q.explicacion, resumen:'Encontrar el error en: ' + palabras.join(' ') + ' (correcto: ' + palabras[i] + ' → ' + q.correccion + ')' };
  }
  return null;
}

function pickFromBank(){
  let pool = BANK.map((q, i) => ({ q, i })).filter(o => (S.topic === 'todos' || o.q.tema === S.topic) && !S.usedBank.has(o.i));
  if(!pool.length){
    BANK.forEach((q, i) => { if(S.topic === 'todos' || q.tema === S.topic) S.usedBank.delete(i); });
    pool = BANK.map((q, i) => ({ q, i })).filter(o => S.topic === 'todos' || o.q.tema === S.topic);
  }
  const o = pool[Math.floor(Math.random() * pool.length)];
  S.usedBank.add(o.i);
  return normalize(JSON.parse(JSON.stringify(o.q)));
}

const FUT = ['é','ás','á','emos','án'];
function conj(inf, tense, p){
  if(tense === 'fut') return inf + FUT[p];
  return inf.slice(0, -2) + ENDS[tense][inf.slice(-2)][p];
}
const SUBJ = [['yo',0],['tú',1],['él',2],['ella',2],['nosotros',3],['ellos',4],['ellas',4],['ustedes',4],['Ana',2],['mi hermano',2],['los niños',4],['mis primos',4]];

  pres:{ marker:'Ahora mismo', hint:'algo que ocurre ahora' },
  pret:{ marker:'Ayer',        hint:'un hecho pasado y terminado' },

function genConjug(){
  const v = rnd(VERBS[rnd(['ar','er','ir'])]), inf = v[0], comp = v[1];
  const sj = rnd(SUBJ), subj = sj[0], p = sj[1];
  const t = rnd(S.level === 'Primaria' ? ['pres','pret'] : ['pres','pret','fut']);
  const correct = conj(inf, t, p);
  const same = [0,1,2,3,4].filter(x => x !== p).map(x => conj(inf, t, x)).filter(f => f !== correct);
  const badT = t === 'pres' ? 'pret' : t === 'pret' ? 'fut' : 'pret';
  const bad = [0,1,2,3,4].map(x => conj(inf, badT, x)).filter(f => f !== correct);
  return { tipo:'opcion',
    pregunta:'Completa con la forma correcta del verbo:\n' + TENSES[t].marker + ' ' + subj + ' ___ (' + inf + ') ' + comp + '.',
    opciones:[correct, ...pick(same, 2), rnd(bad)], correcta:0,
    explicacion:'«' + TENSES[t].marker + '» habla de ' + TENSES[t].hint + ', y con «' + subj + '» el verbo «' + inf + '» se conjuga «' + correct + '».' };
}

function genErrorVerb(){
  const v = rnd(VERBS[rnd(['ar','er','ir'])]), sj = rnd(SUBJ), p = sj[1];

const ART = { m:{s:'el', p:'los'}, f:{s:'la', p:'las'} };

function genConcordancia(){
  const nn = rnd(NOUNS), a = rnd(ADJ.filter(x => x[0] !== x[1])), n = rnd(['s','p']);
  const g = nn.g, og = g === 'm' ? 'f' : 'm', on = n === 's' ? 'p' : 's';
  const ph = (art, adj) => art + ' ' + nounForm(nn, n) + ' ' + adj;

  const wrongs = pick([ph(ART[og][n], adjForm(a, g, n)), ph(ART[g][n], adjForm(a, og, n)), ph(ART[g][n], adjForm(a, g, on)), ph(ART[g][on], adjForm(a, g, n))], 3);
  return { tipo:'opcion', pregunta:'¿Cuál frase tiene la concordancia correcta?', opciones:[correct, ...wrongs], correcta:0,
    explicacion:'El artículo, el sustantivo y el adjetivo deben concordar en género y número: «' + correct + '».' };

function genTildeEscritura(){
  const all = [...TW.esdr, ...TW.agu, ...TW.gra], w = rnd(all), word = w[0];

    explicacion:'«' + word + '» es ' + tipoName + ' (' + w[1] + '), por eso lleva la tilde en esa sílaba.' };

  {t:'sust',texto:'Acompaño al sustantivo para decir cómo es:\ngrande, rojo, simpático o cortés.\n¿Qué palabra soy?',r:'Adjetivo',o:['Verbo','Pronombre','Preposición'],pista:'Con «casa» formo «casa grande».',e:'El adjetivo acompaña al sustantivo y expresa cómo es.'},
  {t:'sust',texto:'Voy delante del sustantivo y concuerdo con él:\nel, la, los, las, un, una…\n¿Qué palabra soy?',r:'Artículo',o:['Pronombre','Adverbio','Verbo'],pista:'Sin mí no dirías «la casa» ni «un perro».',e:'El artículo acompaña al sustantivo y concuerda con él en género y número.'},
  {t:'verb',texto:'Expreso lo que haces, lo que eres o lo que pasa,\ny me conjugo en tiempos y personas.\n¿Qué soy?',r:'Verbo',o:['Sustantivo','Adjetivo','Artículo'],pista:'Cantar, ser y llover son ejemplos de mí.',e:'El verbo se conjuga y expresa acción, estado o proceso.'},
  {t:'verb',texto:'Modifico al verbo, al adjetivo o a otro adverbio,\ny no cambio de género ni de número:\naquí, hoy, muy, bien…\n¿Qué soy?',r:'Adverbio',o:['Adjetivo','Sustantivo','Artículo'],pista:'En «habla bien», la palabra «bien» soy yo.',e:'El adverbio es invariable y modifica al verbo, al adjetivo o a otro adverbio.'},
  {t:'pron',texto:'Sustituyo al nombre para no repetirlo:\nyo, tú, él, ella, nosotros…\n¿Qué soy?',r:'Pronombre',o:['Sustantivo','Verbo','Adjetivo'],pista:'En «Ana canta; ella baila», «ella» soy yo.',e:'El pronombre reemplaza al sustantivo para evitar repetirlo.'},
  {t:'pron',texto:'Soy una palabra invariable que enlaza otras:\na, de, en, con, por, para…\n¿Qué soy?',r:'Preposición',o:['Pronombre','Verbo','Sustantivo'],pista:'Con mi ayuda dices «voy a casa» o «café con leche».',e:'La preposición es invariable y une palabras o grupos de palabras.'},
  {t:'sin',texto:'Digo lo mismo que otra palabra,\npero me escribo de otra manera.\n¿Qué soy?',r:'Sinónimo',o:['Antónimo','Verbo','Adjetivo'],pista:'Mi nombre significa «significados que van juntos».',e:'Un sinónimo tiene un significado igual o muy parecido al de otra palabra.'},
  {t:'sin',texto:'Digo lo contrario de otra palabra:\nalto y bajo, día y noche.\n¿Qué soy?',r:'Antónimo',o:['Sinónimo','Sustantivo','Adverbio'],pista:'Mi nombre viene de «anti»: contrario.',e:'Un antónimo tiene un significado opuesto al de otra palabra.'},
  {t:'tilde',texto:'Soy una rayita que se posa sobre una vocal\ny marca dónde suena más fuerte la palabra.\n¿Qué soy?',r:'Tilde',o:['Coma','Punto','Guion'],pista:'Sin mí, «canción» sería «cancion».',e:'La tilde marca la sílaba tónica en las palabras que la necesitan.'},
  {t:'tilde',texto:'Soy cada golpe de voz al pronunciar una palabra:\n«ca-sa» tiene dos de mí.\n¿Qué soy?',r:'Sílaba',o:['Oración','Párrafo','Verbo'],pista:'Puedo ser tónica o átona.',e:'La sílaba es cada grupo de sonidos que se pronuncia en un solo golpe de voz.'},
  {t:'tilde',texto:'Tengo la fuerza en la antepenúltima sílaba\ny siempre llevo tilde, como «música».\n¿Qué palabra soy?',r:'Esdrújula',o:['Aguda','Grave','Monosílaba'],pista:'Otros ejemplos: teléfono y pájaro.',e:'Las esdrújulas tienen la fuerza en la antepenúltima sílaba y siempre llevan tilde.'},
  {t:'punt',texto:'Separo los elementos de una lista\ny marco una pausa corta al leer.\n¿Qué signo soy?',r:'La coma',o:['El punto','Los dos puntos','El guion'],pista:'En «pan, leche y queso» aparezco una vez.',e:'La coma separa elementos en una enumeración y marca pausas breves.'},
  {t:'punt',texto:'Marco el final de una oración\ny después de mí se escribe con mayúscula.\n¿Qué signo soy?',r:'El punto',o:['La coma','Los dos puntos','La tilde'],pista:'Soy pequeño y redondo.',e:'El punto indica el final de una oración o de un texto.'},
  {t:'punt',texto:'Voy al inicio y al final de las preguntas.\nEn español somos una pareja: ¿ ?\n¿Qué somos?',r:'Signos de interrogación',o:['Comillas','Paréntesis','Signos de exclamación'],pista:'Uno de nosotros está «al revés».',e:'Las preguntas se escriben entre signos de interrogación de apertura y de cierre.'},

  {t:'orto',texto:'Me pongo antes de b y de p:\nen «hombre» y en «campo» me ves.\n¿Qué letra soy?',r:'La m',o:['La n','La s','La r'],pista:'Cambio, sombra, campo…',e:'Antes de b y de p se escribe m.'},
  {t:'ora',texto:'Soy quien realiza la acción en una oración.\nEn «Ana canta», yo soy «Ana».\n¿Qué soy?',r:'Sujeto',o:['Predicado','Verbo','Adverbio'],pista:'Búscame preguntando: ¿quién hace la acción?',e:'El sujeto es quien realiza la acción o de quien se habla.'},
  {t:'ora',texto:'Soy todo lo que se dice del sujeto\ny siempre incluyo un verbo.\n¿Qué soy?',r:'Predicado',o:['Sujeto','Sustantivo','Artículo'],pista:'En «Ana canta una canción», soy «canta una canción».',e:'El predicado dice qué hace o cómo es el sujeto y contiene el verbo.'}
];
function genRiddle(t){
  const pool = RID.filter(r => t === 'todos' || r.t === t), r = rnd(pool);
  return { tipo:'acertijo', pregunta:r.texto, opciones:[r.r, ...r.o], correcta:0, pista:r.pista, explicacion:r.e };
}

const GENS = {
  sust:[genConcordancia, genOrdenarSust, () => genRiddle('sust')],
  verb:[genConjug, genConjug, genErrorVerb, () => genRiddle('verb')],
  tilde:[genTildeClasif, genTildeEscritura, genTildeEscritura, () => genRiddle('tilde')],
  orto:[genOrtoLetras, genHomofono, genHomofono, genOrtoLetras, () => genRiddle('orto')],
  punt:[genSignos, genEnumeracion, () => genRiddle('punt')],
  ora:[genSujeto, genOrdenarOra, genErrorVerb, genSujeto, () => genRiddle('ora')],
  pron:[genPronombre, genPreposicion, () => genRiddle('pron')],
  sin:[genSinAnt, genSinAnt, () => genRiddle('sin')]
};
function generate(){
  for(let n = 0; n < 30; n++){
    const key = S.topic === 'todos' ? rnd(Object.keys(GENS)) : S.topic;
    let q = null;
    try{ const raw = rnd(GENS[key])(); q = raw && normalize(raw); }catch(e){ q = null; }
    if(q && !S.seen.includes(q.resumen || q.texto)) return q;
  }
  return pickFromBank();
}

/* ---------- Pantallas ---------- */
function show(name){
  ['home','play','end'].forEach(id => { $('#' + id).hidden = (id !== name); });
  const inGame = (name === 'play');
  $('#hud').hidden = !inGame; $('#progress').hidden = !inGame;
  window.scrollTo({ top:0 });
}
let noticeTimer = null;
function say(msg){
  const n = $('#notice'); n.textContent = msg; n.hidden = false;
  clearTimeout(noticeTimer); noticeTimer = setTimeout(() => { n.hidden = true; }, 7000);
}
function updateHUD(){
  $('#hLives').textContent = '❤️'.repeat(Math.max(S.lives, 0)) + '🤍'.repeat(Math.max(3 - S.lives, 0));
  $('#hStreak').textContent = '🔥 ' + S.streak;
  $('#hScore').textContent = '⭐ ' + S.score;
  $('#bar').style.width = (S.idx / S.total * 100) + '%';
}

/* ---------- Home ---------- */
function buildChips(){
  const lv = $('#levels'), tp = $('#topics');
  Object.keys(LEVELS).forEach(k => {
    const b = el('button', 'chip', LEVELS[k].label); b.type = 'button'; b.setAttribute('aria-pressed', String(k === S.level));
    b.onclick = () => { S.level = k; [...lv.children].forEach(c => c.setAttribute('aria-pressed', String(c === b))); };
    lv.appendChild(b);
  });
  Object.keys(TOPICS).forEach(k => {
    const b = el('button', 'chip', TOPICS[k].label); b.type = 'button'; b.setAttribute('aria-pressed', String(k === S.topic));
    b.onclick = () => { S.topic = k; [...tp.children].forEach(c => c.setAttribute('aria-pressed', String(c === b))); };
    tp.appendChild(b);
  });
}
function renderBest(){ const b = loadBest(); $('#best').textContent = b ? '🏆 Tu récord: ' + b + ' puntos' : ''; }

/* ---------- Flujo del juego ---------- */
function startGame(){
  Object.assign(S, { lives:3, score:0, streak:0, correct:0, idx:0, seen:[], usedBank:new Set(), current:null });
  updateHUD();
  nextQuestion();
}

function nextQuestion(){
  if(S.idx >= S.total || S.lives <= 0) return endGame();
  const q = (S.mode === 'local' || (S.mode === 'motor' && Math.random() < 0.2)) ? pickFromBank() : generate();
  S.current = q;
  S.seen.push(q.resumen || q.texto);
  renderQuestion(q);
}

function renderQuestion(q){
  show('play'); updateHUD();
  S.answered = false; S.hintUsed = false;
  $('#qtype').textContent = TYPE_LABEL[q.tipo];
  $('#qtext').textContent = q.texto;
  $('#fb').hidden = true;
  const area = $('#area'); area.replaceChildren();
  const card = $('#qcard'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  if(q.tipo === 'opcion' || q.tipo === 'acertijo') renderChoices(q, area);
  else if(q.tipo === 'ordenar') renderOrder(q, area);
  else renderError(q, area);
}

function renderChoices(q, area){
  const box = el('div', 'choices');
  q.opciones.forEach((o, i) => {
    const b = el('button', 'choice', o); b.type = 'button';
    b.onclick = () => {
      if(S.answered) return;
      const ok = i === q.correcta;
      const hbEl = area.querySelector('.hintbox .btn'); if(hbEl) hbEl.remove();
      [...box.children].forEach((c, j) => {
        c.disabled = true;
        if(j === q.correcta) c.classList.add('right');
        else if(j === i) c.classList.add('wrong');
        else c.classList.add('dim');
      });
      resolve(ok, ok ? '' : 'La respuesta correcta era: ' + q.opciones[q.correcta]);
    };
    box.appendChild(b);
  });
  area.appendChild(box);
  if(q.tipo === 'acertijo' && q.pista){
    const hb = el('div', 'hintbox');
    const hbtn = el('button', 'btn ghost', '💡 Pedir pista (−5 pts)'); hbtn.type = 'button';
    hbtn.onclick = () => {
      if(S.answered) return;
      S.hintUsed = true; hbtn.remove();
      hb.appendChild(el('div', 'hint', '💡 ' + q.pista));
    };
    hb.appendChild(hbtn); area.appendChild(hb);
  }
}

function renderOrder(q, area){
  const slots = el('div', 'slots'), pool = el('div', 'pool'), actions = el('div', 'row');
  let tiles = [], placed = [];
  let order;
  const orig = q.palabras.join(' ');
  for(let n = 0; n < 8; n++){ order = shuffle(q.palabras.map((w, i) => ({ w, i }))); if(order.map(t => t.w).join(' ') !== orig) break; }
  tiles = order.map((t, k) => ({ w:t.w, i:k }));
  const check = el('button', 'btn primary', 'Comprobar ✓'); check.type = 'button';
  const clear = el('button', 'btn ghost', 'Borrar ↺'); clear.type = 'button';
  function draw(){
    slots.replaceChildren(); pool.replaceChildren();
    if(!placed.length) slots.appendChild(el('span', 'ph', 'Toca las palabras para armar la oración…'));
    placed.forEach(t => {
      const b = el('button', 'tile', t.w); b.type = 'button'; b.disabled = S.answered;
      b.onclick = () => { if(S.answered) return; placed = placed.filter(x => x !== t); tiles.push(t); tiles.sort((a, c) => a.i - c.i); draw(); };
      slots.appendChild(b);
    });
    tiles.forEach(t => {
      const b = el('button', 'tile', t.w); b.type = 'button'; b.disabled = S.answered;
      b.onclick = () => { if(S.answered) return; tiles = tiles.filter(x => x !== t); placed.push(t); draw(); };
      pool.appendChild(b);
    });
    check.disabled = S.answered || tiles.length > 0;
    clear.disabled = S.answered || placed.length === 0;
  }
  clear.onclick = () => { tiles = tiles.concat(placed); placed = []; tiles.sort((a, c) => a.i - c.i); draw(); };
  check.onclick = () => {
    if(S.answered) return;
    const ok = placed.map(t => t.w).join(' ') === orig;
    slots.classList.add(ok ? 'right' : 'wrong');
    resolve(ok, ok ? '' : 'La oración correcta: «' + orig + '»');
    draw();
  };
  actions.appendChild(check); actions.appendChild(clear);
  area.appendChild(slots); area.appendChild(pool); area.appendChild(actions);
  draw();
}

function renderError(q, area){
  const wrap = el('div', 'words');
  q.palabras.forEach((w, i) => {
    const b = el('button', 'word', w); b.type = 'button';
    b.onclick = () => {
      if(S.answered) return;
      const ok = i === q.indiceError;
      [...wrap.children].forEach(c => { c.disabled = true; });
      b.classList.add(ok ? 'right' : 'wrong');
      if(!ok) wrap.children[q.indiceError].classList.add('right');
      resolve(ok, 'Corrección: «' + q.palabras[q.indiceError] + '» → «' + q.correccion + '»');
    };
    wrap.appendChild(b);
  });
  area.appendChild(wrap);
}

function resolve(ok, detail){
  if(S.answered) return;
  S.answered = true; S.idx++;
  const q = S.current;
  if(ok){
    S.streak++; S.correct++;
    const base = S.hintUsed ? 5 : 10;
    S.score += base + Math.min(S.streak - 1, 5) * 2;
  } else { S.streak = 0; S.lives--; }
  updateHUD();
  const fb = $('#fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'no'); fb.hidden = false;
  $('#fbTitle').textContent = ok ? '🎉 ¡Correcto!' + (S.streak >= 3 ? ' Racha de ' + S.streak + ' 🔥' : '') : '💡 ¡Casi! Así se aprende';
  $('#fbDetail').textContent = detail || '';
  $('#fbDetail').hidden = !detail;
  $('#fbExpl').textContent = q.explicacion;
  const last = S.idx >= S.total || S.lives <= 0;
  $('#btnNext').textContent = last ? 'Ver resultados 🏆' : 'Siguiente →';
  fb.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function endGame(){
  const pct = S.correct / S.total;
  const stars = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : pct >= 0.3 ? 1 : 0;
  const best = Math.max(loadBest(), S.score);
  const newRecord = S.score > loadBest();
  if(newRecord) saveBest(best);
  $('#endStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  $('#endTitle').textContent = S.lives <= 0 ? '¡Te quedaste sin vidas!' : stars === 3 ? '¡Eres un genio del español!' : stars === 2 ? '¡Muy bien hecho!' : '¡Buen intento!';
  $('#endMsg').textContent = newRecord && S.score > 0 ? '🏆 ¡Nuevo récord! Sigue así.' : 'Practicar cada día te hará mejorar. ¿Otra ronda?';
  $('#endScore').textContent = S.score; $('#endOk').textContent = S.correct + '/' + S.total; $('#endBest').textContent = best;
  show('end'); renderBest();
}

function goHome(){
  show('home'); renderBest(); updateModeUI();
}

/* ---------- Eventos ---------- */
$('#start').onclick = () => startGame();
$('#again').onclick = () => startGame();
$('#toHome').onclick = goHome;
$('#brand').onclick = goHome;
$('#btnNext').onclick = () => nextQuestion();
$('#modeMotor').onclick = () => { S.mode = 'motor'; updateModeUI(); };
$('#modeLocal').onclick = () => { S.mode = 'local'; updateModeUI(); };

buildChips(); renderBest(); updateModeUI();
})();
</script>
